[project]
name = "beacon-api"
version = "0.1.0"
description = "Beacon dashboard API"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
